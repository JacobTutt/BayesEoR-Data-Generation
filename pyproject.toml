[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayeseor-data-generation"
version = "0.1.0"
description = "Generate BayesEoR sky models and pyuvsim visibilities from an observation configuration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "astropy",
  "astropy-healpix<2",
  "healpy",
  "h5py",
  "mpi4py",
  "numpy<2",
  "pygdsm==1.7.0",
  "pyradiosky==0.3.1",
  "pyuvdata==2.4.1",
  "pyuvsim[sim]==1.2.6",
  "pyyaml",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
