[project]
name = "bayeseor-data-generation"
version = "0.1.0"
description = "A documented observation-to-sky-to-visibility workflow for BayesEoR simulations"
requires-python = ">=3.10"
dependencies = [
  "astropy",
  "astropy-healpix",
  "healpy",
  "h5py",
  "numpy<2",
  "pygdsm==1.7.0",
  "pyradiosky==0.3.1",
  "pyuvdata==2.4.1",
  "pyuvsim[sim]==1.2.6",
  "pyyaml",
  "scipy",
]

[project.scripts]
bayeseor-generate-skies = "generate_skies:main"
bayeseor-simulate = "simulate:main"

[tool.setuptools]
py-modules = ["eor", "generate_skies", "gleam_ateam", "gsm", "simulate"]
