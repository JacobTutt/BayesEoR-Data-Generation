[project]
name = "bayeseor-data-generation"
version = "0.1.0"
description = "Standalone, from-scratch reproduction of the Burba BayesEoR large-FoV simulations"
requires-python = ">=3.10"
dependencies = [
  "astropy",
  "astropy-healpix",
  "healpy",
  "h5py",
  "jsonargparse",
  "numpy<2",
  "pygdsm==1.7.0",
  "pyradiosky==0.3.1",
  "pyuvdata==2.4.1",
  "pyuvsim[sim]==1.2.6",
  "pyyaml",
  "scipy",
]

[project.scripts]
bayeseor-generate = "generate:main"

[tool.setuptools]
py-modules = ["generate"]
