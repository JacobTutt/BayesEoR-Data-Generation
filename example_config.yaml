# Complete example observation and sky configuration.
# Relative paths are interpreted from the directory containing this file.

run:
  overwrite_existing_files: false
  simulate_visibilities: true

output_directory: data/h1c_band2

telescope:
  name: Hex37-14.6m
  antenna_layout: default_configs/hex-37-14.6m.csv
  latitude_deg: -30.72152777777791
  longitude_deg: 21.428305555555557
  altitude_m: 1073.0000000093132
  beam:
    type: airy
    diameter_m: 14.2
  redundant_threshold_m: 1.0

time:
  start_jd: 2459999.067040411
  end_jd: 2459999.127292119
  integration_time_s: 21.511353650861533

frequency:
  start_hz: 150292968.75
  channel_width_hz: 97656.25
  n_channels: 180

sky:
  nside: 128
  # "center" uses the inference mask at the observation midpoint. "union"
  # retains everything that enters its FoV during the full drift scan.
  sky_mask_time_mode: center

  eor:
    fovs_deg: [12.9080728652]
    rms_k: 0.0064
    random_seed: 92381923

  gsm:
    fovs_deg: [12.9080728652, 30.0, 60.0, 90.0, 120.0]
    include_cmb: true
    frequency_chunk_size: 10

  gleam_ateam:
    fovs_deg: [12.9080728652, 30.0, 60.0, 90.0, 120.0]
    a_team_catalogue: default_configs/a_team.csv
    random_seed: 42
    confusion_nside: 256
    reference_frequency_hz: 154000000.0
